suite: controller pod disruption budget
templates:
  - templates/controller-pdb.yaml
release:
  name: efs
  namespace: kube-system
chart:
  version: 0.0.0
  appVersion: 0.0.0
tests:
  - it: is not rendered by default
    asserts:
      - hasDocuments:
          count: 0

  - it: renders minAvailable and the eviction policy when enabled
    set:
      controller:
        podDisruptionBudget:
          enabled: true
    asserts:
      - matchSnapshot: {}

  - it: selects the controller pods
    set:
      controller:
        podDisruptionBudget:
          enabled: true
        name: my-controller
    asserts:
      - equal:
          path: metadata.name
          value: my-controller
      - equal:
          path: spec.selector.matchLabels
          value:
            app: my-controller
            app.kubernetes.io/name: aws-efs-csi-driver
            app.kubernetes.io/instance: efs

  - it: renders only maxUnavailable when it is the only field set
    set:
      controller:
        podDisruptionBudget:
          enabled: true
          maxUnavailable: 1
    asserts:
      - equal:
          path: spec.maxUnavailable
          value: 1
      - notExists:
          path: spec.minAvailable

  - it: fails when both maxUnavailable and minAvailable are set
    set:
      controller:
        podDisruptionBudget:
          enabled: true
          minAvailable: 1
          maxUnavailable: 1
    asserts:
      - failedTemplate:
          errorMessage: "controller.podDisruptionBudget: set only one of maxUnavailable and minAvailable"

  - it: defaults minAvailable to 1 when neither field is set
    set:
      controller:
        podDisruptionBudget:
          enabled: true
          minAvailable: null
    asserts:
      - equal:
          path: spec.minAvailable
          value: 1
      - notExists:
          path: spec.maxUnavailable

  - it: renders a percentage maxUnavailable
    set:
      controller:
        podDisruptionBudget:
          enabled: true
          maxUnavailable: 50%
    asserts:
      - equal:
          path: spec.maxUnavailable
          value: 50%
      - notExists:
          path: spec.minAvailable

  - it: renders a custom minAvailable
    set:
      controller:
        podDisruptionBudget:
          enabled: true
          minAvailable: 2
    asserts:
      - equal:
          path: spec.minAvailable
          value: 2
      - notExists:
          path: spec.maxUnavailable
