suite: controller pod disruption budget
templates:
  - templates/controller-pdb.yaml
release:
  name: efs
  namespace: kube-system
chart:
  version: 0.0.0
  appVersion: 0.0.0
tests:
  - it: is not rendered by default
    asserts:
      - hasDocuments:
          count: 0

  - it: renders minAvailable and the eviction policy when enabled
    set:
      controller:
        podDisruptionBudget:
          enabled: true
    asserts:
      - matchSnapshot: {}

  - it: selects the controller pods
    set:
      controller:
        podDisruptionBudget:
          enabled: true
        name: my-controller
    asserts:
      - equal:
          path: metadata.name
          value: my-controller
      - equal:
          path: spec.selector.matchLabels
          value:
            app: my-controller
            app.kubernetes.io/name: aws-efs-csi-driver
            app.kubernetes.io/instance: efs

  - it: renders maxUnavailable when minAvailable is cleared
    set:
      controller:
        podDisruptionBudget:
          enabled: true
          minAvailable: null
          maxUnavailable: 1
    asserts:
      - equal:
          path: spec.maxUnavailable
          value: 1
      - notExists:
          path: spec.minAvailable
