suite: service accounts and RBAC
release:
  name: efs
  namespace: kube-system
chart:
  version: 0.0.0
  appVersion: 0.0.0
tests:
  - it: creates the controller service account, roles and bindings
    template: templates/controller-serviceaccount.yaml
    asserts:
      - matchSnapshot: {}

  - it: annotates the controller service account
    template: templates/controller-serviceaccount.yaml
    documentIndex: 0
    set:
      controller:
        serviceAccount:
          annotations:
            eks.amazonaws.com/role-arn: arn:aws:iam::111122223333:role/efs-csi-role
    asserts:
      - equal:
          path: metadata.annotations
          value:
            eks.amazonaws.com/role-arn: arn:aws:iam::111122223333:role/efs-csi-role

  - it: binds an existing controller service account when create is false
    template: templates/controller-serviceaccount.yaml
    set:
      controller:
        serviceAccount:
          create: false
          name: existing-sa
    asserts:
      - hasDocuments:
          count: 4
      - isKind:
          of: ServiceAccount
        not: true
      - equal:
          path: subjects[0].name
          value: existing-sa
        documentSelector:
          path: metadata.name
          value: efs-csi-provisioner-binding

  - it: grants filesystem ID lookups when fileSystemIdRefs is enabled
    template: templates/controller-serviceaccount.yaml
    set:
      controller:
        fileSystemIdRefs:
          enabled: true
    asserts:
      - hasDocuments:
          count: 7
      - equal:
          path: rules
          value:
            - apiGroups: [""]
              resources: ["configmaps", "secrets"]
              verbs: ["get"]
        documentSelector:
          path: metadata.name
          value: efs-csi-filesystem-id-reader-role

  - it: creates the node service account, role and binding
    template: templates/node-serviceaccount.yaml
    asserts:
      - matchSnapshot: {}

  - it: drops the node patch permission when disableMutation is true
    template: templates/node-serviceaccount.yaml
    set:
      node:
        serviceAccount:
          disableMutation: true
    asserts:
      - notContains:
          path: rules
          content:
            apiGroups: [""]
            resources: ["nodes"]
            verbs: ["patch"]
        documentSelector:
          path: metadata.name
          value: efs-csi-node-role

  - it: skips the node service account when create is false
    template: templates/node-serviceaccount.yaml
    set:
      node:
        serviceAccount:
          create: false
          name: existing-node-sa
    asserts:
      - hasDocuments:
          count: 2
      - equal:
          path: subjects[0].name
          value: existing-node-sa
        documentSelector:
          path: metadata.name
          value: efs-csi-node-binding
