{{- if and .Values.node.workloadIdentity.enabled (not (semverCompare ">=1.35.0-0" .Capabilities.KubeVersion.Version)) }}
{{- fail "node.workloadIdentity.enabled requires Kubernetes 1.35 or newer" }}
{{- end }}
apiVersion: {{ ternary "storage.k8s.io/v1" "storage.k8s.io/v1beta1" (semverCompare ">=1.18.0-0" .Capabilities.KubeVersion.Version) }}
kind: CSIDriver
metadata:
  name: efs.csi.aws.com
  annotations:
    {{- if .Values.useHelmHooksForCSIDriver }}
    "helm.sh/hook": pre-install, pre-upgrade
    "helm.sh/hook-delete-policy": before-hook-creation
    {{- end }}
    "helm.sh/resource-policy": keep
spec:
  attachRequired: false
  {{- if .Values.node.workloadIdentity.enabled }}
  podInfoOnMount: true
  requiresRepublish: true
  serviceAccountTokenInSecrets: true
  tokenRequests:
    - audience: sts.amazonaws.com
      expirationSeconds: 3600
  {{- end }}
