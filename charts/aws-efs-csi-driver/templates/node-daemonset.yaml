# Node Service
{{- /*
One DaemonSet for .Values.node, named efs-csi-node, and one more for every entry of
.Values.additionalDaemonSets, named efs-csi-node-<entry>. An entry is merged over .Values.node,
so .Values.node holds the defaults for all of them. See docs/additional-daemonsets.md.
*/}}
{{ include "aws-efs-csi-driver.nodeDaemonSet" (mustMergeOverwrite (deepCopy $) (dict "NodeName" "efs-csi-node")) }}
{{- range $name, $values := .Values.additionalDaemonSets }}
{{- $args := dict
  "NodeName" (printf "efs-csi-node-%s" $name)
  "Values" (dict "node" (mustMergeOverwrite (deepCopy $.Values.node) (deepCopy $values)))
}}
---
{{ include "aws-efs-csi-driver.nodeDaemonSet" (mustMergeOverwrite (deepCopy $) $args) }}
{{- end }}
