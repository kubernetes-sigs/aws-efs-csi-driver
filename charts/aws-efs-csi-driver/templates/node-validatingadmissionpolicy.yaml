{{- if and .Values.node.validatingAdmissionPolicy.enabled (not .Values.node.serviceAccount.disableMutation) (semverCompare ">=1.30-0" .Capabilities.KubeVersion.Version) }}
{{- $taintKey := include "aws-efs-csi-driver.agentNotReadyTaintKey" . }}
# Limits the node service account to removing the {{ $taintKey }} taint from the Node its pod runs on.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: efs-csi-node
  labels:
    {{- include "aws-efs-csi-driver.labels" . | nindent 4 }}
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["*"]
        operations: ["CREATE", "UPDATE", "DELETE"]
        resources: ["nodes", "nodes/*"]
  matchConditions:
    - name: node-service-account
      {{- if eq .Release.Name "kustomize" }}
      # kustomize sets the namespace of the resources, but not inside this expression, so match the name in any namespace.
      # Service account names can't contain ':'.
      expression: >-
        request.userInfo.username.startsWith('system:serviceaccount:') &&
        request.userInfo.username.endsWith({{ printf ":%s" .Values.node.serviceAccount.name | squote }})
      {{- else }}
      expression: request.userInfo.username == {{ printf "system:serviceaccount:%s:%s" .Release.Namespace .Values.node.serviceAccount.name | quote }}
      {{- end }}
  variables:
    # the name of the node the pod that requested the service account token runs on
    - name: nodeName
      expression: >-
        request.userInfo.?extra[?'authentication.kubernetes.io/node-name'].orValue([]).size() == 1 ?
        request.userInfo.extra['authentication.kubernetes.io/node-name'][0] : ''
    - name: isUpdate
      expression: request.operation == 'UPDATE' && request.?subResource.orValue('') == ''
    - name: oldTaints
      expression: "variables.isUpdate ? oldObject.spec.?taints.orValue([]) : []"
    - name: newTaints
      expression: "variables.isUpdate ? object.spec.?taints.orValue([]) : []"
  validations:
    - expression: variables.nodeName != ''
      message: the service account token is not bound to a pod on a node
    - expression: variables.isUpdate
      message: the EFS CSI node service account may only update Node objects
    - expression: request.name == variables.nodeName
      messageExpression: "'the EFS CSI node on ' + variables.nodeName + ' may only update its own Node object, not ' + request.name"
    - expression: >-
        !variables.isUpdate || (
        object.metadata.?labels.orValue({}) == oldObject.metadata.?labels.orValue({}) &&
        object.metadata.?annotations.orValue({}) == oldObject.metadata.?annotations.orValue({}) &&
        object.metadata.?finalizers.orValue([]) == oldObject.metadata.?finalizers.orValue([]) &&
        object.metadata.?ownerReferences.orValue([]) == oldObject.metadata.?ownerReferences.orValue([]) &&
        object.spec.all(k, k == 'taints' || (k in oldObject.spec && object.spec[k] == oldObject.spec[k])) &&
        oldObject.spec.all(k, k == 'taints' || k in object.spec))
      message: the EFS CSI node service account may only change the taints of its own Node object
    - expression: >-
        variables.newTaints.all(t, t in variables.oldTaints) &&
        variables.oldTaints.all(t, t.key == {{ $taintKey | squote }} || t in variables.newTaints)
      message: the EFS CSI node service account may only remove the {{ $taintKey }} taint from its own Node object
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: efs-csi-node
  labels:
    {{- include "aws-efs-csi-driver.labels" . | nindent 4 }}
spec:
  policyName: efs-csi-node
  validationActions: ["Deny"]
{{- end }}
